services:
  llama-server:
    restart: unless-stopped
    build: .
    ports:
      - "8881:8080"
    volumes:
      - .:/workspace:ro  # Mounts the workspace to access scripts and models
      - /mnt/S/.cache/llama.cpp:/root/.cache/llama.cpp
      - /mnt/S/.cache/huggingface:/root/.cache/huggingface
    environment:
      - LLAMA_SERVER=/usr/local/bin/llama-server
      - VERIFY_ASSISTANT_GGUF=0  # Disables python validation script in container
      - MAIN_GGUF=/root/.cache/huggingface/hub/models--ggml-org--gemma-4-26B-A4B-it-GGUF/snapshots/4006d4d95819e0a4975eae220762f1552dc2f699/gemma-4-26B-A4B-it-Q4_K_M.gguf
      - DRAFT_GGUF=/root/.cache/huggingface/hub/models--AtomicChat--gemma-4-26B-A4B-it-assistant-GGUF/snapshots/171ecca181ec00ed6ffacb573195aa7c644bbdc6/gemma-4-26B-A4B-it-assistant.Q4_K_M.gguf
      - HOST=0.0.0.0
      - PORT=8080
      # You can easily override script defaults here:
      - CTX=163840
      # - NGL=99
      # - SPEC=mtp
      - PARALLEL=1
      - KV_UNIFIED=0
    entrypoint: ["/bin/bash", "/workspace/scripts/run-gemma4-mtp-server.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
