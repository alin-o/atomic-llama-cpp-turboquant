services:
  llama-server:
    restart: unless-stopped
    build: .
    ports:
      - "8881:8080"
    volumes:
      - .:/workspace:ro # Mounts the workspace to access scripts and models
      - /mnt/S/.cache/llama.cpp:/root/.cache/llama.cpp
      - /mnt/S/.cache/huggingface:/root/.cache/huggingface
    environment:
      - LLAMA_SERVER=/usr/local/bin/llama-server
      - VERIFY_ASSISTANT_GGUF=0 # Disables python validation script in container
      # Set HF_REPO / HF_DRAFT_REPO and the server downloads + resumes via its
      # built-in -hf / -hfd (common/download.cpp). No snapshot hash pinning
      # needed; llama-server handles ETag validation and HTTP Range resume.
      - HF_REPO=ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_K_M
      - HF_DRAFT_REPO=AtomicChat/gemma-4-26B-A4B-it-assistant-GGUF:gemma-4-26B-A4B-it-assistant.Q4_K_M.gguf
      # llama-server's find_best_model regex fails on full-filename tags,
      # so the script falls back to DRAFT_GGUF when the cached file exists.
      - DRAFT_GGUF=/root/.cache/huggingface/hub/models--AtomicChat--gemma-4-26B-A4B-it-assistant-GGUF/snapshots/171ecca181ec00ed6ffacb573195aa7c644bbdc6/gemma-4-26B-A4B-it-assistant.Q4_K_M.gguf
      - HOST=0.0.0.0
      - PORT=8080
      # You can easily override script defaults here:
      - CTX=262144
      # - NGL=99
      # - SPEC=mtp
      - LLAMA_ARG_CACHE_RAM=10240
      - SLOT_SAVE_PATH=/root/.cache/llama.cpp/kv # persisted KV caches (rw mount); enables /slots?action=save|restore
      - PARALLEL=1
      - KV_UNIFIED=0
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_HTTP=4
    entrypoint: [ "/bin/bash", "/workspace/scripts/run-gemma4-mtp-server.sh" ]
    cpuset: "0-7"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          cpus: 8
          memory: 16G
