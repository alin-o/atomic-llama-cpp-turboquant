services:
  llama-server:
    restart: unless-stopped
    build: .
    ports:
      - "8881:8080"
    volumes:
      - .:/workspace:ro # Mounts the workspace to access scripts and models
      - /mnt/S/.cache/llama.cpp:/root/.cache/llama.cpp
      - /mnt/S/.cache/huggingface:/root/.cache/huggingface
    ulimits:
      core:
        soft: -1
        hard: -1
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      - LLAMA_SERVER=/usr/local/bin/llama-server
      - VERIFY_ASSISTANT_GGUF=0 # Disables python validation script in container
      - HF_REPO=ggml-org/gemma-4-31B-it-GGUF:Q4_K_M
      - HF_DRAFT_REPO=AtomicChat/gemma-4-31B-it-assistant-GGUF:gemma-4-31B-it-assistant.Q4_K_M.gguf
      # llama-server's find_best_model regex fails on full-filename tags,
      # so the script falls back to DRAFT_GGUF when the cached file exists.
      - DRAFT_GGUF=/root/.cache/huggingface/hub/models--AtomicChat--gemma-4-31B-it-assistant-GGUF/snapshots/c2357e3ea670ef03c5f1a984e7fc37cdb5dc45c4/gemma-4-31B-it-assistant.Q4_K_M.gguf
      - HOST=0.0.0.0
      - PORT=8080
      # You can easily override script defaults here:
      - CTX=163840
      # - NGL=99
      # - SPEC=mtp
      - PARALLEL=2
      - KV_UNIFIED=0
      - LLAMA_GRAPH_REUSE_DISABLE=1
      - LLAMA_ARG_CACHE_RAM=10240
      - SLOT_SAVE_PATH=/root/.cache/llama.cpp/kv # persisted KV caches (rw mount); enables /slots?action=save|restore
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_HTTP=4
    entrypoint: [ "/bin/bash", "/workspace/scripts/run-gemma4-mtp-server.sh" ]
    cpuset: "0-7"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          cpus: 8
          memory: 16G
