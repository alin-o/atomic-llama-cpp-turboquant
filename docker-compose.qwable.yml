# Huihui Qwable 3.6 27B abliterated (Q4_K_M_Q8, dense + NextN, has mmproj).
#
# Set HF_REPO=owner/repo:tag and the server downloads + resumes via its
# built-in -hf (common/download.cpp). llama-server handles ETag validation
# and HTTP Range resume automatically with a single .downloadInProgress
# partial per file — no fragmentation, no orphan .incomplete files.
#
# To switch models: edit HF_REPO and HF_DRAFT_REPO below. To use a
# pre-staged file on disk instead, set MAIN_GGUF=/path/to/file.gguf
# (and leave HF_REPO empty).
#
# Files in the Huihui repo (from /api/models):
#   Huihui-Qwable-3.6-27b-abliterated-Q4_K_M_F16-MTP.gguf
#   Huihui-Qwable-3.6-27b-abliterated-Q4_K_M_Q8-MTP.gguf
#   Huihui-Qwable-3.6-27b-abliterated_F16-MTP.gguf
#   mmproj-model-f16.gguf
#
# Q4_K_M_Q8 = Q4_K_M weights with Q8 attention (a hybrid quant). The mmproj
# ships in the same repo, so we use the same owner/repo for both.

services:
  llama-server:
    restart: unless-stopped
    build: .
    ports:
      - "8881:8080"
    volumes:
      - .:/workspace:ro
      - /mnt/S/.cache/llama.cpp:/root/.cache/llama.cpp
      - /mnt/S/.cache/huggingface:/root/.cache/huggingface
    environment:
      - LLAMA_SERVER=/usr/local/bin/llama-server
      - VERIFY_NEXTN_GGUF=0
      # Model + draft (NextN: same model loaded as both target and draft)
      - HF_REPO=huihui-ai/Huihui-Qwable-3.6-27b-abliterated-MTP-GGUF:Q4_K_M_Q8
      - HF_DRAFT_REPO=huihui-ai/Huihui-Qwable-3.6-27b-abliterated-MTP-GGUF:Q4_K_M_Q8
      - HOST=0.0.0.0
      - PORT=8080
      # Tuning
      - CTX=102400           # 100K context (the model supports up to 262K)
      # - NGL=99             # all layers to GPU (default)
      - SPEC=nextn           # speculative decoding
      - DRAFT_MAX=4          # up to 4 chained draft tokens per round
      - PARALLEL=1           # concurrent slots
      - KV_UNIFIED=1         # unified KV cache
      # Server features
      - LLAMA_ARG_CACHE_RAM=10240
      - SLOT_SAVE_PATH=/root/.cache/llama.cpp/kv
      - LLAMA_ARG_THINK_BUDGET=0
      - LLAMA_ARG_THINK_BUDGET_MESSAGE=Wrap up.
      - LLAMA_ARG_MMPROJ_OFFLOAD=0
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_HTTP=4
      # Vision tower (mmproj) — stays as a static path because the run-script
      # doesn't currently forward HF_REPO_MMPROJ to --mmproj. After the first
      # successful download, find the actual snapshot dir hash with:
      #   ls /mnt/S/.cache/huggingface/hub/models--huihui-ai--Huihui-Qwable-3.6-27b-abliterated-MTP-GGUF/snapshots/
      # and replace <SNAPSHOT_HASH> below. The file inside is mmproj-model-f16.gguf.
      - LLAMA_ARG_MMPROJ=/root/.cache/huggingface/hub/models--huihui-ai--Huihui-Qwable-3.6-27b-abliterated-MTP-GGUF/snapshots/c40abf22a0093495ab658519ccc69962cd66da72/mmproj-model-f16.gguf
    entrypoint: [ "/bin/bash", "/workspace/scripts/run-qwen36-27b-nextn-server.sh" ]
    cpuset: "0-7"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          cpus: 8
          memory: 24G
