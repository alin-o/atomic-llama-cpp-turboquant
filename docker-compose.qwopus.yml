services:
  llama-server:
    restart: unless-stopped
    build: .
    ports:
      - "8881:8080"
    volumes:
      - .:/workspace:ro # Mounts the workspace to access scripts and models
      - /mnt/S/.cache/llama.cpp:/root/.cache/llama.cpp
      - /mnt/S/.cache/huggingface:/root/.cache/huggingface
    environment:
      - LLAMA_SERVER=/usr/local/bin/llama-server
      - VERIFY_NEXTN_GGUF=0 # Disables python validation script in container
      # Set HF_REPO=owner/repo:tag and the server downloads + resumes via its
      # built-in -hf (common/download.cpp). No snapshot hash pinning needed;
      # llama-server handles ETag validation and HTTP Range resume automatically.
      # To use a pre-staged file instead, set MAIN_GGUF=/path/to/file.gguf
      # (and leave HF_REPO empty).
      - HF_REPO=Jackrong/Qwopus3.6-27B-Coder-Compat-MTP-GGUF:Q5_K_M
      - HF_DRAFT_REPO=Jackrong/Qwopus3.6-27B-Coder-Compat-MTP-GGUF:Q5_K_M  # shared-model NextN
      - HOST=0.0.0.0
      - PORT=8080
      # You can override script defaults here if needed:
      - CTX=128000
      # - NGL=99
      - SPEC=nextn
      - DRAFT_MAX=4
      - PARALLEL=1
      - KV_UNIFIED=1
      - LLAMA_ARG_CACHE_RAM=10240
      - SLOT_SAVE_PATH=/root/.cache/llama.cpp/kv # persisted KV caches (rw mount); enables /slots?action=save|restore
      - LLAMA_ARG_THINK_BUDGET=512
      - LLAMA_ARG_THINK_BUDGET_MESSAGE=Wrap up.
      - LLAMA_ARG_MMPROJ=/root/.cache/huggingface/hub/models--unsloth--Qwen3.6-27B-MTP-GGUF/snapshots/5cb35eb3dcbf52dbce5f87dbc64df6aaffadcace/mmproj-BF16.gguf
      - LLAMA_ARG_MMPROJ_OFFLOAD=0 # uncomment to keep vision tower on CPU (~1 GiB VRAM saved)
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_HTTP=4

    entrypoint: [ "/bin/bash", "/workspace/scripts/run-qwen36-27b-nextn-server.sh" ]
    cpuset: "0-7"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          cpus: 8
          memory: 24G
